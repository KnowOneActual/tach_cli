repos:
  # Ruff: fast Python linter + formatter
  # https://github.com/astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff          # lint (with auto-fix)
        args: ["--fix"]
      - id: ruff-format   # format

  # mypy: static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - typer>=0.12
          - rich>=13.0
          - textual>=0.50
          - platformdirs>=4.0
          - tomli>=2.0

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer       # ensure files end with a newline
      - id: trailing-whitespace     # strip trailing whitespace
      - id: check-yaml              # validate YAML syntax
      - id: check-toml              # validate TOML syntax
      - id: check-merge-conflict    # catch leftover merge conflict markers
      - id: check-added-large-files # warn on large file commits
        args: ["--maxkb=500"]
      - id: debug-statements        # catch leftover print/pdb/breakpoint calls
      - id: detect-private-key      # catch accidentally committed private keys
      - id: check-json              # validate JSON syntax
      - id: check-ast               # check Python files parse correctly
